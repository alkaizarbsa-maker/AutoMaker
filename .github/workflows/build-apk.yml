name: Build APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack project zip
        run: |
          ZIP="$(ls -t tapproject*.zip 2>/dev/null | head -n 1)"
          if [ -z "$ZIP" ]; then ZIP="$(ls -t *.zip | head -n 1)"; fi
          if [ -z "$ZIP" ]; then echo "No .zip found in repo root"; exit 1; fi
          echo "Unpacking $ZIP"
          rm -rf project
          unzip -o "$ZIP" -d project
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Install platform and build tools
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          for i in 1 2 3; do
            sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" && break
            echo "sdkmanager attempt $i failed, retrying..."
            sleep 10
          done
          sdkmanager --list_installed
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
      - name: Setup Gradle 8.7
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle-8.7-bin.zip
          echo "$PWD/gradle-8.7/bin" >> $GITHUB_PATH
      - name: Build debug APK
        run: gradle -p project :app:assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: project/app/build/outputs/apk/debug/app-debug.apk
